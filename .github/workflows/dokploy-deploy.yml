name: Build and Deploy to Dokploy

on:
  push:
    branches:
      - master # Cambia esto si tu rama principal tiene otro nombre (ej. master)

env:
  # Nombre de la imagen en Docker Hub
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/sistema-hospital-pedidos

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app # Apunta a la carpeta donde está tu Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caché para hacer las construcciones MUCHO más rápidas en el futuro
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Trigger Dokploy Deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Trigger Dokploy Webhook
        # Reemplaza la URL en los secrets por la Webhook URL que te da Dokploy en la pestaña "Deployments"
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
